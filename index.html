<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Рассрочка Pro v10</title>
<style>
/* ============================================================
   RASSROCHKA PRO v10 — стили
   Fluent Design / Windows 11 стилистика: акриловые карточки,
   мягкие тени, скругления 16-20px, светлая/тёмная тема.
   ============================================================ */

* { box-sizing: border-box; margin: 0; padding: 0; }

:root[data-theme="light"] {
  --bg: #F3F3F3;
  --bg-elevated: #FAFAFA;
  --card-bg: #FFFFFF;
  --card-border: rgba(0,0,0,0.06);
  --text: #1B1B1B;
  --text-secondary: #616161;
  --text-tertiary: #8A8A8A;
  --accent: #0F6CBD;
  --accent-hover: #115EA3;
  --accent-light: #E8F1FB;
  --success: #0E7C0E;
  --success-light: #E6F4E6;
  --danger: #C42B1C;
  --danger-light: #FDECEA;
  --warning: #9D5D00;
  --warning-light: #FFF4CE;
  --border: rgba(0,0,0,0.08);
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow: 0 4px 16px rgba(0,0,0,0.08);
  --shadow-lg: 0 16px 40px rgba(0,0,0,0.16);
  --overlay: rgba(0,0,0,0.35);
  --sidebar-bg: rgba(250,250,250,0.9);
  --input-bg: #FFFFFF;
}

:root[data-theme="dark"] {
  --bg: #1F1F1F;
  --bg-elevated: #262626;
  --card-bg: #2C2C2C;
  --card-border: rgba(255,255,255,0.08);
  --text: #F3F3F3;
  --text-secondary: #C6C6C6;
  --text-tertiary: #9B9B9B;
  --accent: #4CC2FF;
  --accent-hover: #6FD0FF;
  --accent-light: rgba(76,194,255,0.14);
  --success: #6CCB5F;
  --success-light: rgba(108,203,95,0.14);
  --danger: #FF99A4;
  --danger-light: rgba(255,153,164,0.14);
  --warning: #FCE100;
  --warning-light: rgba(252,225,0,0.12);
  --border: rgba(255,255,255,0.10);
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
  --shadow: 0 4px 16px rgba(0,0,0,0.35);
  --shadow-lg: 0 16px 40px rgba(0,0,0,0.5);
  --overlay: rgba(0,0,0,0.55);
  --sidebar-bg: rgba(38,38,38,0.9);
  --input-bg: #333333;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI Variable", "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  transition: background .25s ease, color .25s ease;
}

button, input, select, textarea { font-family: inherit; color: inherit; }

::selection { background: var(--accent-light); color: var(--accent); }

/* ---------- Layout ---------- */
#app { display: flex; min-height: 100vh; }

.sidebar {
  width: 250px;
  flex-shrink: 0;
  background: var(--sidebar-bg);
  backdrop-filter: blur(20px);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 20px 14px;
  position: sticky;
  top: 0;
  height: 100vh;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px 24px 10px;
}
.brand-mark {
  width: 38px; height: 38px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--accent), #7CC3F5);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 700; font-size: 17px;
  box-shadow: var(--shadow-sm);
}
.brand-text { display: flex; flex-direction: column; line-height: 1.15; }
.brand-text b { font-size: 15px; font-weight: 700; }
.brand-text span { font-size: 11px; color: var(--text-tertiary); }

.nav { display: flex; flex-direction: column; gap: 4px; flex: 1; }
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 14px;
  border-radius: 10px;
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  transition: background .15s ease, color .15s ease;
  user-select: none;
  border: none;
  background: transparent;
  text-align: left;
  width: 100%;
}
.nav-item svg { flex-shrink: 0; opacity: .85; }
.nav-item:hover { background: var(--accent-light); color: var(--text); }
.nav-item.active { background: var(--accent-light); color: var(--accent); font-weight: 600; }
.nav-item.active svg { opacity: 1; }

.sidebar-footer { display: flex; flex-direction: column; gap: 6px; padding-top: 10px; }
.theme-toggle {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px;
  border-radius: 10px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  cursor: pointer;
  font-size: 13px;
  color: var(--text-secondary);
}

.main {
  flex: 1;
  min-width: 0;
  padding: 28px 34px 60px 34px;
  overflow-x: hidden;
}

.page-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 22px;
  flex-wrap: wrap;
  gap: 12px;
}
.page-title { font-size: 26px; font-weight: 700; letter-spacing: -.3px; }
.page-subtitle { color: var(--text-tertiary); font-size: 13px; margin-top: 2px; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 11px 20px;
  border-radius: 10px;
  border: none;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: transform .08s ease, background .15s ease, box-shadow .15s ease, opacity .15s ease;
  white-space: nowrap;
}
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--accent); color: #fff; box-shadow: var(--shadow-sm); }
.btn-primary:hover { background: var(--accent-hover); }
.btn-secondary { background: var(--card-bg); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--bg-elevated); }
.btn-danger { background: var(--danger-light); color: var(--danger); }
.btn-danger:hover { opacity: .85; }
.btn-success { background: var(--success); color: #fff; }
.btn-success:hover { opacity: .9; }
.btn-ghost { background: transparent; color: var(--text-secondary); padding: 9px 12px; }
.btn-ghost:hover { background: var(--bg-elevated); }
.btn-sm { padding: 7px 12px; font-size: 12.5px; border-radius: 8px; }
.btn-icon { width: 38px; height: 38px; padding: 0; border-radius: 10px; }
.btn-block { width: 100%; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* ---------- Cards / Stats ---------- */
.grid-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}
.stat-card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--radius, 18px);
  border-radius: 18px;
  padding: 20px;
  box-shadow: var(--shadow-sm);
  position: relative;
  overflow: hidden;
  transition: box-shadow .2s ease, transform .2s ease;
}
.stat-card:hover { box-shadow: var(--shadow); transform: translateY(-2px); }
.stat-card .icon-badge {
  width: 36px; height: 36px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 14px;
}
.stat-label { font-size: 12.5px; color: var(--text-tertiary); font-weight: 600; text-transform: uppercase; letter-spacing: .4px; margin-bottom: 6px; }
.stat-value { font-size: 26px; font-weight: 700; letter-spacing: -.5px; }
.stat-sub { font-size: 12px; color: var(--text-tertiary); margin-top: 4px; }

.tone-accent .icon-badge { background: var(--accent-light); color: var(--accent); }
.tone-success .icon-badge { background: var(--success-light); color: var(--success); }
.tone-danger .icon-badge { background: var(--danger-light); color: var(--danger); }
.tone-warning .icon-badge { background: var(--warning-light); color: var(--warning); }
.tone-danger .stat-value { color: var(--danger); }
.tone-success .stat-value { color: var(--success); }

.card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 18px;
  padding: 22px;
  box-shadow: var(--shadow-sm);
}

.section-title {
  font-size: 15px; font-weight: 700; margin-bottom: 14px;
  display: flex; align-items: center; justify-content: space-between;
}

.two-col { display: grid; grid-template-columns: 1.3fr 1fr; gap: 18px; align-items: start; }

/* ---------- Search / toolbar ---------- */
.search-wrap { position: relative; flex: 1; min-width: 220px; }
.search-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-tertiary); }
.search-input, .select-input, .text-input, textarea.text-input {
  width: 100%;
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 14px;
  color: var(--text);
  outline: none;
  transition: border-color .15s ease, box-shadow .15s ease;
}
.search-input { padding-left: 42px; }
.search-input:focus, .select-input:focus, .text-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
.search-hero { padding: 16px 16px 16px 46px; font-size: 15px; border-radius: 14px; }
.search-hero-wrap svg { left: 16px; }

.toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
.chip-group { display: flex; gap: 6px; background: var(--bg-elevated); padding: 4px; border-radius: 12px; border: 1px solid var(--border); }
.chip {
  padding: 7px 14px; border-radius: 9px; font-size: 12.5px; font-weight: 600;
  color: var(--text-secondary); cursor: pointer; border: none; background: transparent;
  white-space: nowrap;
}
.chip.active { background: var(--card-bg); color: var(--accent); box-shadow: var(--shadow-sm); }

/* ---------- Contracts grid ---------- */
.contracts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.contract-card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 18px;
  padding: 18px;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: box-shadow .2s ease, transform .2s ease;
  display: flex; flex-direction: column; gap: 12px;
}
.contract-card:hover { box-shadow: var(--shadow); transform: translateY(-2px); }
.cc-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.cc-name { font-size: 16px; font-weight: 700; }
.cc-meta { font-size: 12.5px; color: var(--text-tertiary); margin-top: 2px; }
.badge {
  font-size: 11px; font-weight: 700; padding: 5px 10px; border-radius: 999px;
  text-transform: uppercase; letter-spacing: .3px; white-space: nowrap;
}
.badge-active { background: var(--accent-light); color: var(--accent); }
.badge-overdue { background: var(--danger-light); color: var(--danger); }
.badge-closed { background: var(--success-light); color: var(--success); }

.cc-rows { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.cc-row { display: flex; justify-content: space-between; color: var(--text-secondary); }
.cc-row b { color: var(--text); font-weight: 600; }

.progress-track { width: 100%; height: 8px; border-radius: 999px; background: var(--bg-elevated); overflow: hidden; }
.progress-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), #7CC3F5); transition: width .4s ease; }
.progress-fill.done { background: linear-gradient(90deg, var(--success), #7CD97C); }
.progress-fill.overdue-fill { background: linear-gradient(90deg, var(--danger), #FF8A80); }

.progress-big { height: 16px; }
.progress-big-wrap { display: flex; flex-direction: column; gap: 8px; }
.progress-big-labels { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-secondary); }
.progress-big-percent { font-size: 34px; font-weight: 800; letter-spacing: -1px; }

/* ---------- Empty state ---------- */
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; color: var(--text-tertiary); text-align: center; gap: 10px; }
.empty-state svg { opacity: .4; margin-bottom: 6px; }
.empty-state h3 { color: var(--text-secondary); font-size: 15px; }

/* ---------- Lists (payments, upcoming) ---------- */
.list-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 4px; border-bottom: 1px solid var(--border);
  font-size: 13.5px;
}
.list-row:last-child { border-bottom: none; }
.list-row .lr-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
.avatar {
  width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
  background: var(--accent-light); color: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 13px;
}
.lr-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lr-sub { font-size: 11.5px; color: var(--text-tertiary); }
.lr-amount { font-weight: 700; white-space: nowrap; }

/* ---------- Forms ---------- */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.form-group label { font-size: 12.5px; font-weight: 600; color: var(--text-secondary); }
.form-group.full { grid-column: 1 / -1; }
.hint { font-size: 11.5px; color: var(--text-tertiary); }

/* ---------- Modal ---------- */
.modal-overlay {
  position: fixed; inset: 0; background: var(--overlay);
  display: flex; align-items: center; justify-content: center;
  z-index: 200; padding: 20px; backdrop-filter: blur(4px);
  animation: fadeIn .18s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--card-bg); border-radius: 20px; box-shadow: var(--shadow-lg);
  width: 100%; max-width: 520px; max-height: 88vh; overflow-y: auto;
  padding: 26px; animation: popIn .2s cubic-bezier(.2,.9,.3,1.2);
  border: 1px solid var(--card-border);
}
.modal.modal-wide { max-width: 760px; }
@keyframes popIn { from { opacity: 0; transform: translateY(14px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
.modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.modal-header h2 { font-size: 19px; font-weight: 700; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

/* ---------- Detail page ---------- */
.detail-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.detail-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.info-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 16px; margin-top: 18px; }
.info-item .il { font-size: 11.5px; color: var(--text-tertiary); font-weight: 600; text-transform: uppercase; letter-spacing: .3px; margin-bottom: 4px; }
.info-item .iv { font-size: 15px; font-weight: 600; }

.timeline { display: flex; flex-direction: column; }
.tl-item { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.tl-item:last-child { border-bottom: none; }
.tl-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--success); margin-top: 5px; flex-shrink: 0; }
.tl-content { flex: 1; display: flex; justify-content: space-between; gap: 10px; }
.tl-date { font-size: 11.5px; color: var(--text-tertiary); }

/* ---------- Lock screen ---------- */
#lockScreen {
  position: fixed; inset: 0; z-index: 500;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 18px;
}
.lock-box { display: flex; flex-direction: column; align-items: center; gap: 16px; }
.lock-dots { display: flex; gap: 12px; }
.lock-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border); transition: all .15s ease; }
.lock-dot.filled { background: var(--accent); border-color: var(--accent); }
.lock-dot.shake-anim { animation: shake .35s; }
@keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-8px);} 75%{transform:translateX(8px);} }
.pin-pad { display: grid; grid-template-columns: repeat(3, 64px); gap: 12px; }
.pin-key {
  width: 64px; height: 64px; border-radius: 50%; border: 1px solid var(--border);
  background: var(--card-bg); font-size: 20px; font-weight: 600; cursor: pointer; color: var(--text);
}
.pin-key:active { background: var(--accent-light); }

/* ---------- Misc ---------- */
.text-secondary { color: var(--text-secondary); }
.text-tertiary { color: var(--text-tertiary); }
.text-danger { color: var(--danger); }
.text-success { color: var(--success); }
.mt-8 { margin-top: 8px; } .mt-16 { margin-top: 16px; } .mt-24 { margin-top: 24px; }
.flex { display: flex; } .flex-between { display: flex; justify-content: space-between; align-items: center; }
.gap-8 { gap: 8px; } .gap-12 { gap: 12px; }
.divider { height: 1px; background: var(--border); margin: 18px 0; }
.settings-row { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--border); gap: 16px; flex-wrap: wrap; }
.settings-row:last-child { border-bottom: none; }
.settings-row .sr-title { font-weight: 600; font-size: 14px; }
.settings-row .sr-desc { font-size: 12.5px; color: var(--text-tertiary); margin-top: 2px; }
.switch { position: relative; width: 44px; height: 26px; border-radius: 999px; background: var(--border); cursor: pointer; transition: background .2s; flex-shrink:0; }
.switch.on { background: var(--accent); }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: var(--shadow-sm); }
.switch.on::after { transform: translateX(18px); }

.toast-wrap { position: fixed; bottom: 24px; right: 24px; z-index: 400; display: flex; flex-direction: column; gap: 10px; }
.toast {
  background: var(--card-bg); border: 1px solid var(--card-border); box-shadow: var(--shadow-lg);
  padding: 14px 18px; border-radius: 12px; font-size: 13.5px; font-weight: 600;
  display: flex; align-items: center; gap: 10px; animation: popIn .2s ease;
  min-width: 220px;
}
.toast.success { color: var(--success); }
.toast.error { color: var(--danger); }

.mobile-nav { display: none; }

/* ---------- Responsive ---------- */
@media (max-width: 860px) {
  .two-col { grid-template-columns: 1fr; }
  .form-grid { grid-template-columns: 1fr; }
}

@media (max-width: 768px) {
  #app { flex-direction: column; }
  .sidebar { display: none; }
  .main { padding: 18px 16px 90px 16px; }
  .mobile-nav {
    display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 150;
    background: var(--sidebar-bg); backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    justify-content: space-around; padding: 8px 4px calc(8px + env(safe-area-inset-bottom, 0px)) 4px;
  }
  .mobile-nav .nav-item { flex-direction: column; gap: 3px; font-size: 10.5px; padding: 6px 8px; width: auto; text-align: center; }
  .grid-stats { grid-template-columns: repeat(2, 1fr); }
  .page-title { font-size: 21px; }
  .modal { padding: 18px; border-radius: 16px 16px 0 0; max-height: 92vh; }
  .pin-pad { grid-template-columns: repeat(3, 56px); }
  .pin-key { width: 56px; height: 56px; }
}

@media (max-width: 420px) {
  .grid-stats { grid-template-columns: 1fr 1fr; }
  .contracts-grid { grid-template-columns: 1fr; }
}

/* Print styles */
@media print {
  body * { visibility: hidden; }
  #printArea, #printArea * { visibility: visible; }
  #printArea { position: absolute; top: 0; left: 0; width: 100%; padding: 30px; color: #000; background: #fff; }
}
</style>
</head>
<body>

<!-- ============ LOCK SCREEN ============ -->
<div id="lockScreen" style="display:none;">
  <div class="lock-box">
    <div class="brand-mark" style="width:56px;height:56px;font-size:22px;">РП</div>
    <div style="font-size:18px;font-weight:700;">Рассрочка Pro</div>
    <div class="text-tertiary" style="font-size:13px;">Введите PIN-код</div>
    <div class="lock-dots" id="lockDots"></div>
    <div class="pin-pad" id="pinPad"></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" style="display:none;">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">РП</div>
      <div class="brand-text"><b>Рассрочка Pro</b><span>v10</span></div>
    </div>
    <nav class="nav" id="navMenu"></nav>
    <div class="sidebar-footer">
      <div class="theme-toggle" id="themeToggle">
        <span id="themeToggleLabel">Тёмная тема</span>
        <div class="switch" id="themeSwitch"></div>
      </div>
    </div>
  </aside>

  <main class="main" id="mainContent"></main>
</div>

<nav class="mobile-nav" id="mobileNav"></nav>
<div id="modalRoot"></div>
<div class="toast-wrap" id="toastWrap"></div>
<div id="printArea" style="display:none;"></div>

<script>
(function () {
'use strict';

/* ============================================================
   ICONS — компактный набор inline SVG (линия, 2px stroke)
   ============================================================ */
const ICONS = {

/* ============================================================
   UTILS — вспомогательные функции: даты, деньги, id
   ============================================================ */
const Utils = {
  uid() { return 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 9); },

  pad(n) { return n < 10 ? '0' + n : '' + n; },

  todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' + this.pad(d.getMonth() + 1) + '-' + this.pad(d.getDate());
  },

  parseDate(str) {
    // ожидает формат YYYY-MM-DD, безопасно относительно часового пояса
    if (!str) return null;
    const [y, m, d] = str.split('-').map(Number);
    return new Date(y, m - 1, d);
  },

  addMonths(date, n) {
    const d = new Date(date.getTime());
    const day = d.getDate();
    d.setDate(1);
    d.setMonth(d.getMonth() + n);
    const lastDay = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    d.setDate(Math.min(day, lastDay));
    return d;
  },

  formatDate(d) {
    if (!d) return '—';
    if (typeof d === 'string') d = this.parseDate(d);
    return this.pad(d.getDate()) + '.' + this.pad(d.getMonth() + 1) + '.' + d.getFullYear();
  },

  formatDateLong(d) {
    if (!d) return '—';
    if (typeof d === 'string') d = this.parseDate(d);
    const months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
    return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
  },

  formatMoney(n) {
    n = Math.round(n || 0);
    return n.toLocaleString('ru-RU') + ' сум';
  },

  formatMoneyShort(n) {
    n = Math.round(n || 0);
    return n.toLocaleString('ru-RU');
  },

  formatUSD(n) {
    const rate = Settings.get().usdRate;
    if (!rate || rate <= 0) return '';
    return '≈ $' + (n / rate).toLocaleString('en-US', { maximumFractionDigits: 2 });
  },

  daysBetween(a, b) {
    return Math.round((b - a) / 86400000);
  },

  escapeHtml(str) {
    if (str == null) return '';
    return String(str).replace(/[&<>"']/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s]));
  },

  initials(name) {
    if (!name) return '?';
    const parts = name.trim().split(/\s+/);
    return ((parts[0]||'')[0]||'') .toUpperCase() + ((parts[1]||'')[0]||'').toUpperCase();
  },

  monthName(m) {
    const names = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
    return names[m];
  },

  downloadFile(filename, content, mime) {
    const blob = new Blob([content], { type: mime || 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  },
};

/* ============================================================
   STORAGE — работа с LocalStorage
   ============================================================ */
const STORAGE_KEY = 'rassrochka_pro_v10_data';

const Storage = {
  _state: null,

  defaultState() {
    return {
      contracts: [],
      settings: { pin: '', usdRate: 0, theme: 'light' },
    };
  },

  load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) { this._state = this.defaultState(); return this._state; }
      const parsed = JSON.parse(raw);
      this._state = Object.assign(this.defaultState(), parsed);
      this._state.settings = Object.assign(this.defaultState().settings, parsed.settings || {});
      if (!Array.isArray(this._state.contracts)) this._state.contracts = [];
      return this._state;
    } catch (e) {
      console.error('Storage load error', e);
      this._state = this.defaultState();
      return this._state;
    }
  },

  save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(this._state));
    } catch (e) {
      console.error('Storage save error', e);
      UI.toast('Не удалось сохранить данные', 'error');
    }
  },

  state() { return this._state; },
};

/* ============================================================
   CONTRACTS — модель и расчёты договоров рассрочки
   ============================================================ */
const Contracts = {
  getAll() { return Storage.state().contracts; },

  getById(id) { return this.getAll().find(c => c.id === id); },

  add(data) {
    const months = Math.max(1, Number(data.months) || 1);
    const basePrice = Number(data.price) || 0;
    const markup = Calculator.markupFor(basePrice, months);
    const c = {
      id: Utils.uid(),
      name: data.name.trim(),
      phone: data.phone || '',
      product: data.product || '',
      imei: data.imei || '',
      basePrice: basePrice,
      price: markup ? markup.finalTotal : basePrice,
      downPayment: Number(data.downPayment) || 0,
      months: months,
      saleDate: data.saleDate || Utils.todayStr(),
      comment: data.comment || '',
      payments: [],
      createdAt: Date.now(),
    };
    this.getAll().unshift(c);
    Storage.save();
    return c;
  },

  update(id, data) {
    const c = this.getById(id);
    if (!c) return;
    const months = Math.max(1, Number(data.months) || 1);
    const basePrice = Number(data.price) || 0;
    const markup = Calculator.markupFor(basePrice, months);
    Object.assign(c, {
      name: data.name.trim(),
      phone: data.phone || '',
      product: data.product || '',
      imei: data.imei || '',
      basePrice: basePrice,
      price: markup ? markup.finalTotal : basePrice,
      downPayment: Number(data.downPayment) || 0,
      months: months,
      saleDate: data.saleDate || c.saleDate,
      comment: data.comment !== undefined ? data.comment : c.comment,
    });
    Storage.save();
  },

  remove(id) {
    const list = this.getAll();
    const idx = list.findIndex(c => c.id === id);
    if (idx > -1) list.splice(idx, 1);
    Storage.save();
  },

  addPayment(contractId, payment) {
    const c = this.getById(contractId);
    if (!c) return;
    c.payments.push({
      id: Utils.uid(),
      amount: Number(payment.amount) || 0,
      date: payment.date || Utils.todayStr(),
      comment: payment.comment || '',
      skipped: !!payment.skipped,
    });
    c.payments.sort((a, b) => a.date.localeCompare(b.date));
    Storage.save();
  },

  // Пропуск платежа: долг клиента не уменьшается, но следующий платёж
  // по графику переносится на месяц вперёд (используется, когда клиент
  // договорился пропустить месяц без штрафа).
  skipPayment(contractId, comment) {
    this.addPayment(contractId, { amount: 0, date: Utils.todayStr(), comment: comment || 'Платёж пропущен', skipped: true });
  },

  removePayment(contractId, paymentId) {
    const c = this.getById(contractId);
    if (!c) return;
    c.payments = c.payments.filter(p => p.id !== paymentId);
    Storage.save();
  },

  // Основной расчёт статистики по договору — всё вычисляется автоматически.
  // c.price уже содержит итоговую сумму к оплате (посчитанную при создании/
  // редактировании договора по ставке за срок, без отдельной наценки).
  // Первый платёж по графику приходится на саму дату продажи.
  getStats(c) {
    const total = c.price;
    const paymentsSum = c.payments.reduce((s, p) => s + p.amount, 0);
    const totalPaid = c.downPayment + paymentsSum;
    const remaining = Math.max(total - totalPaid, 0);
    const percent = total > 0 ? Math.min(100, (totalPaid / total) * 100) : 0;
    const financed = Math.max(total - c.downPayment, 0);
    const monthlyPayment = c.months > 0 ? Math.round(financed / c.months) : 0;

    const saleDate = Utils.parseDate(c.saleDate);
    const endDate = Utils.addMonths(saleDate, Math.max(c.months - 1, 0));

    const skipsCount = c.payments.filter(p => p.skipped).length;
    let installmentsCovered = monthlyPayment > 0 ? Math.floor(totalPaid / monthlyPayment) : 0;
    installmentsCovered = Math.min(installmentsCovered + skipsCount, c.months);

    let nextPaymentDate = null;
    if (remaining > 0 && installmentsCovered < c.months) {
      // Первый платёж (installmentsCovered = 0) назначен на дату продажи
      nextPaymentDate = Utils.addMonths(saleDate, installmentsCovered);
    }

    const today = Utils.parseDate(Utils.todayStr());
    let status = 'active';
    let overdueDays = 0;
    if (remaining <= 0) {
      status = 'closed';
    } else if (nextPaymentDate && nextPaymentDate < today) {
      status = 'overdue';
      overdueDays = Utils.daysBetween(nextPaymentDate, today);
    }

    return { total, monthlyPayment, totalPaid, remaining, percent, nextPaymentDate, endDate, status, overdueDays, saleDate, skipsCount };
  },

  // Договор был полностью закрыт в указанном месяце?
  closedInMonth(c, year, month) {
    const stats = this.getStats(c);
    if (stats.status !== 'closed') return false;
    let cum = c.downPayment;
    if (cum >= stats.total) {
      const d = Utils.parseDate(c.saleDate);
      return d.getFullYear() === year && d.getMonth() === month;
    }
    const sorted = [...c.payments].sort((a, b) => a.date.localeCompare(b.date));
    for (const p of sorted) {
      cum += p.amount;
      if (cum >= stats.total) {
        const d = Utils.parseDate(p.date);
        return d.getFullYear() === year && d.getMonth() === month;
      }
    }
    return false;
  },

  // Сколько нужно было получить в указанном месяце по графику
  monthTarget(year, month) {
    let sum = 0;
    for (const c of this.getAll()) {
      const stats = this.getStats(c);
      const monthly = stats.monthlyPayment;
      if (monthly <= 0) continue;
      for (let i = 1; i <= c.months; i++) {
        const due = Utils.addMonths(stats.saleDate, i - 1);
        if (due.getFullYear() === year && due.getMonth() === month) {
          const isLast = i === c.months;
          const amount = isLast ? (stats.total - c.downPayment - monthly * (c.months - 1)) : monthly;
          sum += amount;
        }
      }
    }
    return Math.max(sum, 0);
  },

  // Сколько фактически получено в указанном месяце (взносы + первые взносы)
  monthReceived(year, month) {
    let sum = 0;
    for (const c of this.getAll()) {
      const sd = Utils.parseDate(c.saleDate);
      if (c.downPayment > 0 && sd.getFullYear() === year && sd.getMonth() === month) sum += c.downPayment;
      for (const p of c.payments) {
        const pd = Utils.parseDate(p.date);
        if (pd.getFullYear() === year && pd.getMonth() === month) sum += p.amount;
      }
    }
    return sum;
  },

  filterAndSort(list, opts) {
    let out = list.slice();
    if (opts.query) {
      const q = opts.query.toLowerCase();
      out = out.filter(c =>
        (c.name || '').toLowerCase().includes(q) ||
        (c.phone || '').toLowerCase().includes(q) ||
        (c.product || '').toLowerCase().includes(q) ||
        (c.imei || '').toLowerCase().includes(q)
      );
    }
    if (opts.status && opts.status !== 'all') {
      out = out.filter(c => this.getStats(c).status === opts.status);
    }
    const sort = opts.sort || 'date_desc';
    out.sort((a, b) => {
      const sa = this.getStats(a), sb = this.getStats(b);
      switch (sort) {
        case 'date_asc': return a.saleDate.localeCompare(b.saleDate);
        case 'date_desc': return b.saleDate.localeCompare(a.saleDate);
        case 'name_asc': return a.name.localeCompare(b.name, 'ru');
        case 'remaining_desc': return sb.remaining - sa.remaining;
        case 'remaining_asc': return sa.remaining - sb.remaining;
        default: return 0;
      }
    });
    return out;
  },
};

/* ============================================================
   SETTINGS
   ============================================================ */
const Settings = {
  get() { return Storage.state().settings; },
  update(patch) { Object.assign(Storage.state().settings, patch); Storage.save(); },
};

/* ============================================================
   REPORTS
   ============================================================ */
const Reports = {
  summary() {
    const all = Contracts.getAll();
    let totalDebt = 0, totalRevenue = 0, activeCount = 0, closedCount = 0, overdueCount = 0;
    let sumPrice = 0, sumMonths = 0, totalExpenses = 0, totalSalePrice = 0;
    for (const c of all) {
      const s = Contracts.getStats(c);
      totalDebt += s.remaining;
      totalRevenue += s.totalPaid;
      sumPrice += c.price;
      sumMonths += c.months;
      totalExpenses += (c.basePrice != null ? c.basePrice : c.price);
      totalSalePrice += c.price;
      if (s.status === 'active') activeCount++;
      else if (s.status === 'closed') closedCount++;
      else if (s.status === 'overdue') overdueCount++;
    }
    const now = new Date();
    const receivedThisMonth = Contracts.monthReceived(now.getFullYear(), now.getMonth());
    const avgCheck = all.length ? sumPrice / all.length : 0;
    const avgTerm = all.length ? sumMonths / all.length : 0;
    const totalProfit = totalSalePrice - totalExpenses;
    return { totalDebt, totalRevenue, receivedThisMonth, activeCount, closedCount, overdueCount, avgCheck, avgTerm, totalCount: all.length, totalExpenses, totalProfit };
  },
};

/* ============================================================
   STATE — локальное состояние экрана (фильтры, навигация)
   ============================================================ */
const State = {
  contractsFilter: { query: '', status: 'all', sort: 'date_desc' },
  currentContractId: null,
  monthView: (() => { const d = new Date(); return { year: d.getFullYear(), month: d.getMonth() }; })(),
  calc: { currency: 'uzs', priceUzs: 0, priceUsd: 0, expanded: { 3: false, 6: false, 9: false, 12: false } },
};

/* ============================================================
   CALCULATOR — калькулятор рассрочки для клиента (3/6/9/12 мес.)
   Логика перенесена и адаптирована из предыдущей версии программы.
   ============================================================ */
const Calculator = {
  RATES: { 3: 0.12, 6: 0.24, 9: 0.37, 12: 0.44 },
  MONTHS: [3, 6, 9, 12],

  clean(v) { return Number(String(v).replace(/\s/g, '').replace(/\D/g, '')) || 0; },

  // Наценка отменена — расчёт идёт только по ставке за выбранный срок рассрочки.
  // Итоговая сумма для ОДНОГО срока (используется при создании договора)
  markupFor(price, months) {
    if (!price || price <= 0 || !this.RATES[months]) return null;
    const rate = this.RATES[months];
    const exactTotal = price * (1 + rate);
    const step = 5000;
    const monthly = Math.ceil(exactTotal / months / step) * step;
    const finalTotal = monthly * months;
    return { rate, monthly, finalTotal };
  },

  compute(price, currency) {
    if (!price || price <= 0) return null;
    const rate = Settings.get().usdRate;
    const step = currency === 'uzs' ? 5000 : 5;
    const results = this.MONTHS.map(m => {
      const exactTotal = price * (1 + this.RATES[m]);
      const monthly = Math.ceil(exactTotal / m / step) * step;
      const total = monthly * m;
      const sumEq = (currency === 'usd' && rate > 0) ? Math.round(total * rate) : null;
      return { m, monthly, total, sumEq };
    });
    const note = (currency === 'usd' && rate > 0) ? '≈ ' + Math.round(price * rate).toLocaleString('ru-RU') + ' сум по текущему курсу' : '';
    return { note, results };
  },

  // Полный график платежей по месяцам для одного срока — по клику разворачивается
  renderResults(price, currency) {
    const data = this.compute(price, currency);
    const unit = currency === 'uzs' ? ' сум' : ' $';
    if (!data) return emptyState('calc', 'Введите цену товара, чтобы увидеть расчёт');
    return '<div>' + data.results.map(r => {
      const expanded = !!State.calc.expanded[r.m];
      let scheduleRows = '';
      for (let i = 1; i <= r.m; i++) {
        scheduleRows += '<tr><td style="padding:7px 8px;color:var(--text-tertiary);">Платёж ' + i + '</td>' +
          '<td style="padding:7px 8px;font-weight:600;">' + r.monthly.toLocaleString('ru-RU') + unit + '</td>' +
          '<td style="padding:7px 8px;color:var(--text-tertiary);text-align:right;">' + (r.monthly * i).toLocaleString('ru-RU') + unit + '</td></tr>';
      }
      const detail = expanded ?
        '<div style="margin-top:10px;border-top:1px solid var(--border);padding-top:8px;overflow-x:auto;">' +
          '<table style="width:100%;border-collapse:collapse;font-size:12.5px;">' +
            '<tr style="text-align:left;"><th style="padding:4px 8px;color:var(--text-tertiary);font-size:11px;">Платёж</th><th style="padding:4px 8px;color:var(--text-tertiary);font-size:11px;">Сумма</th><th style="padding:4px 8px;color:var(--text-tertiary);font-size:11px;text-align:right;">Нарастающим итогом</th></tr>' +
            scheduleRows +
          '</table>' +
        '</div>' : '';
      return '<div class="list-row" data-action="calc-toggle-schedule" data-months="' + r.m + '" style="cursor:pointer;flex-direction:column;align-items:stretch;">' +
        '<div class="flex-between">' +
          '<div style="min-width:0;"><div class="lr-title">' + r.m + ' месяцев</div>' +
          '<div class="lr-sub">Итого: ' + r.total.toLocaleString('ru-RU') + unit +
            (r.sumEq ? ' (≈ ' + r.sumEq.toLocaleString('ru-RU') + ' сум)' : '') + '</div></div>' +
          '<div class="flex gap-8" style="align-items:center;">' +
            '<div class="lr-amount" style="color:var(--accent);font-size:15.5px;">' + r.monthly.toLocaleString('ru-RU') + unit + '<span class="text-tertiary" style="font-weight:500;font-size:11.5px;">/мес</span></div>' +
            '<span style="color:var(--text-tertiary);transition:transform .15s ease;transform:rotate(' + (expanded ? '90' : '0') + 'deg);display:flex;">' + icon('chevron', 15) + '</span>' +
          '</div>' +
        '</div>' + detail +
      '</div>';
    }).join('') + '</div>';
  },

  badgeHtml(price, currency) {
    const data = this.compute(price, currency);
    return data ? data.note : '';
  },
};

/* ============================================================
   UI — общие вспомогательные вещи интерфейса: модалки, тосты
   ============================================================ */
const UI = {
  currentPage: 'dashboard',

  toast(message, type) {
    const wrap = document.getElementById('toastWrap');
    const el = document.createElement('div');
    el.className = 'toast ' + (type || '');
    el.innerHTML = (type === 'success' ? icon('check', 16) : type === 'error' ? icon('alert', 16) : '') + '<span>' + Utils.escapeHtml(message) + '</span>';
    wrap.appendChild(el);
    setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 2600);
  },

  openModal(html, opts) {
    opts = opts || {};
    const root = document.getElementById('modalRoot');
    root.innerHTML =
      '<div class="modal-overlay" id="modalOverlay">' +
        '<div class="modal ' + (opts.wide ? 'modal-wide' : '') + '">' + html + '</div>' +
      '</div>';
    document.getElementById('modalOverlay').addEventListener('mousedown', (e) => {
      if (e.target.id === 'modalOverlay') UI.closeModal();
    });
  },

  closeModal() {
    document.getElementById('modalRoot').innerHTML = '';
  },

  confirmModal(title, text, onConfirm, danger) {
    this.openModal(
      '<div class="modal-header"><h2>' + Utils.escapeHtml(title) + '</h2>' +
      '<button class="btn btn-icon btn-ghost" data-action="close-modal">' + icon('x') + '</button></div>' +
      '<p class="text-secondary" style="font-size:14px;line-height:1.5;">' + Utils.escapeHtml(text) + '</p>' +
      '<div class="modal-actions">' +
        '<button class="btn btn-secondary" data-action="close-modal">Отмена</button>' +
        '<button class="btn ' + (danger ? 'btn-danger' : 'btn-primary') + '" id="confirmBtn">Подтвердить</button>' +
      '</div>'
    );
    document.getElementById('confirmBtn').addEventListener('click', () => { onConfirm(); UI.closeModal(); });
  },

  render() {
    document.getElementById('mainContent').innerHTML = Pages[this.currentPage]();
    this.renderNav();
  },

  navItems: [
    { id: 'calculator', label: 'Калькулятор', icon: 'calc' },
    { id: 'dashboard', label: 'Рабочий стол', icon: 'home' },
    { id: 'contracts', label: 'Договоры', icon: 'file' },
    { id: 'month', label: 'Обзор месяца', icon: 'calendar' },
    { id: 'reports', label: 'Отчёты', icon: 'target' },
    { id: 'settings', label: 'Настройки', icon: 'settings' },
  ],

  renderNav() {
    const buildItem = (item) =>
      '<button class="nav-item ' + (UI.currentPage === item.id ? 'active' : '') + '" data-nav="' + item.id + '">' +
        icon(item.icon, 19) + '<span>' + item.label + '</span>' +
      '</button>';
    document.getElementById('navMenu').innerHTML = this.navItems.map(buildItem).join('');
    document.getElementById('mobileNav').innerHTML = this.navItems.map(buildItem).join('');
  },

  goTo(page) {
    this.currentPage = page;
    this.render();
    window.scrollTo(0, 0);
  },
};

Pages.dashboard = function () {
  const all = Contracts.getAll();
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();

  let totalOwed = 0, overdueCount = 0;
  for (const c of all) {
    const s = Contracts.getStats(c);
    if (s.status !== 'closed') totalOwed += s.remaining;
    if (s.status === 'overdue') overdueCount++;
  }
  const monthTarget = Contracts.monthTarget(y, m);
  const monthReceived = Contracts.monthReceived(y, m);
  const monthRemaining = Math.max(monthTarget - monthReceived, 0);

  // ближайшие платежи (не просрочены, есть следующая дата)
  const withStats = all.map(c => ({ c, s: Contracts.getStats(c) }));
  const today = Utils.parseDate(Utils.todayStr());

  const dueToday = withStats.filter(x => x.s.nextPaymentDate && x.s.nextPaymentDate.getTime() === today.getTime());
  const upcoming = withStats
    .filter(x => x.s.status === 'active' && x.s.nextPaymentDate && x.s.nextPaymentDate > today)
    .sort((a, b) => a.s.nextPaymentDate - b.s.nextPaymentDate)
    .slice(0, 6);

  // последние оплаты
  const recentPayments = [];
  for (const c of all) for (const p of c.payments) recentPayments.push({ c, p });
  recentPayments.sort((a, b) => b.p.date.localeCompare(a.p.date));
  const lastPayments = recentPayments.slice(0, 6);

  return '' +
  '<div class="page-header">' +
    '<div><div class="page-title">Рабочий стол</div><div class="page-subtitle">' + Utils.formatDateLong(today) + '</div></div>' +
    '<button class="btn btn-primary" data-action="new-contract">' + icon('plus', 18) + ' Новый договор</button>' +
  '</div>' +

  '<div class="search-hero-wrap search-wrap" style="margin-bottom:22px;">' +
    icon('search', 18) +
    '<input class="search-input search-hero" placeholder="Поиск по имени, телефону, товару или IMEI…" id="heroSearch" value="">' +
  '</div>' +

  '<div class="grid-stats">' +
    statCard('wallet', 'accent', 'Всего должны', Utils.formatMoney(totalOwed), Utils.formatUSD(totalOwed)) +
    statCard('target', 'accent', 'Получить в этом месяце', Utils.formatMoney(monthTarget), Utils.monthName(m) + ' ' + y) +
    statCard('coins', 'success', 'Получено', Utils.formatMoney(monthReceived), 'в этом месяце') +
    statCard('box', 'warning', 'Осталось получить', Utils.formatMoney(monthRemaining), 'до конца месяца') +
    statCard('alert', 'danger', 'Просрочки', overdueCount, overdueCount ? 'требуют внимания' : 'всё в порядке') +
  '</div>' +

  '<div class="two-col">' +
    '<div class="card">' +
      '<div class="section-title">Ближайшие платежи</div>' +
      (upcoming.length ? '<div>' + upcoming.map(x => listRowContract(x.c, x.s)).join('') + '</div>' :
        emptyState('calendar', 'Нет предстоящих платежей')) +
    '</div>' +
    '<div class="card">' +
      '<div class="section-title">Нужно получить сегодня</div>' +
      (dueToday.length ? '<div>' + dueToday.map(x => listRowContract(x.c, x.s)).join('') + '</div>' :
        emptyState('check', 'Сегодня платежей не запланировано')) +
    '</div>' +
  '</div>' +

  '<div class="card mt-24">' +
    '<div class="section-title">Последние оплаты</div>' +
    (lastPayments.length ? '<div>' + lastPayments.map(x => listRowPayment(x.c, x.p)).join('') + '</div>' :
      emptyState('coins', 'Оплат пока не было')) +
  '</div>';
};

/* ------------------- Month overview page ------------------- */
Pages.month = function () {
  const { year, month } = State.monthView;
  const target = Contracts.monthTarget(year, month);
  const received = Contracts.monthReceived(year, month);
  const remaining = Math.max(target - received, 0);
  const percent = target > 0 ? Math.min(100, (received / target) * 100) : (received > 0 ? 100 : 0);

  const all = Contracts.getAll();
  let contractsCount = 0, closedCount = 0, overdueCount = 0;
  for (const c of all) {
    const s = Contracts.getStats(c);
    const sd = Utils.parseDate(c.saleDate);
    if (sd.getFullYear() === year && sd.getMonth() === month) contractsCount++;

  '</div>' +

  '<div class="grid-stats mt-24">' +

    statCard('coins', 'success', 'Получено', Utils.formatMoney(received), '') +

    statCard('alert', 'danger', 'Просрочки', overdueCount, 'на текущий момент') +

};

          icon('alert', 14) + ' Сумма меньше ежемесячного платежа — остаток перейдёт на следующий период</div>';

/* ============================================================
   EXPORT / IMPORT
   ============================================================ */
function exportJSON() {
  Utils.downloadFile('rassrochka-pro-backup-' + Utils.todayStr() + '.json', JSON.stringify(Storage.state(), null, 2), 'application/json');
  UI.toast('Файл экспортирован', 'success');
}

function importJSON(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (!parsed || !Array.isArray(parsed.contracts)) throw new Error('bad format');
      UI.confirmModal('Импорт данных', 'Текущие данные будут заменены содержимым файла. Продолжить?', () => {
        Storage._state = Object.assign(Storage.defaultState(), parsed);
        Storage._state.settings = Object.assign(Storage.defaultState().settings, parsed.settings || {});
        Storage.save();
        applyTheme(Storage.state().settings.theme);
        UI.toast('Данные импортированы', 'success');
        UI.goTo('dashboard');
      }, true);
    } catch (e) {
      UI.toast('Файл повреждён или имеет неверный формат', 'error');
    }
  };
  reader.readAsText(file);
}

function exportExcel() {
  const header = ['Имя', 'Телефон', 'Товар', 'IMEI', 'Стоимость', 'Первый взнос', 'Срок (мес)', 'Дата продажи', 'Ежемесячный платёж', 'Оплачено', 'Остаток', 'Следующий платёж', 'Статус', 'Комментарий'];
  const statusRu = { active: 'Активный', overdue: 'Просрочка', closed: 'Закрыт' };
  const lines = [header.join(';')];
  for (const c of Contracts.getAll()) {
    const s = Contracts.getStats(c);
    lines.push([
      csv(c.name), csv(c.phone), csv(c.product), csv(c.imei), c.price, c.downPayment, c.months,
      Utils.formatDate(c.saleDate), s.monthlyPayment, s.totalPaid, s.remaining,
      s.nextPaymentDate ? Utils.formatDate(s.nextPaymentDate) : '', statusRu[s.status], csv(c.comment),
    ].join(';'));
  }
  Utils.downloadFile('rassrochka-pro-' + Utils.todayStr() + '.csv', '\uFEFF' + lines.join('\r\n'), 'text/csv;charset=utf-8');
  UI.toast('Файл экспортирован', 'success');
}
function csv(s) { return '"' + String(s || '').replace(/"/g, '""') + '"'; }

/* ============================================================
   THEME
   ============================================================ */
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  const isDark = theme === 'dark';
  document.getElementById('themeSwitch').classList.toggle('on', isDark);
  document.getElementById('themeToggleLabel').textContent = isDark ? 'Светлая тема' : 'Тёмная тема';
}
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  Settings.update({ theme: next });
  if (UI.currentPage === 'settings') UI.render();
}

    pad.innerHTML = keys.map(k => k === '' ? '<div></div>' :
      '<button class="pin-key" data-key="' + k + '">' + k + '</button>').join('');
    pad.querySelectorAll('.pin-key').forEach(btn => btn.addEventListener('click', () => Lock.press(btn.dataset.key)));
    this.renderDots();
  },
  renderDots() {
    const pinLen = 4;
    const dots = document.getElementById('lockDots');
    dots.innerHTML = '';
    for (let i = 0; i < Math.max(pinLen, this.entered.length); i++) {
      const d = document.createElement('div');
      d.className = 'lock-dot' + (i < this.entered.length ? ' filled' : '');
      dots.appendChild(d);
    }
  },
  press(key) {
    if (key === '⌫') { this.entered = this.entered.slice(0, -1); this.renderDots(); return; }
    if (this.entered.length >= 6) return;
    this.entered += key;
    this.renderDots();
    const pin = Settings.get().pin;
    if (this.entered.length === pin.length) {
      if (this.entered === pin) {
        setTimeout(() => { document.getElementById('lockScreen').style.display = 'none'; document.getElementById('app').style.display = 'flex'; }, 120);
      } else {
        const dots = document.getElementById('lockDots');
        dots.classList.add('shake-anim');
        setTimeout(() => { dots.classList.remove('shake-anim'); this.entered = ''; this.renderDots(); }, 350);
      }
    }
  },
  check() {
    const pin = Settings.get().pin;
    if (pin) {
      document.getElementById('lockScreen').style.display = 'flex';
      document.getElementById('app').style.display = 'none';
      this.entered = '';
      this.render();
    } else {
      document.getElementById('lockScreen').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
    }
  },
};

/* ============================================================
   EVENT DELEGATION — единая точка обработки кликов/действий
   ============================================================ */
function bindGlobalEvents() {
  document.addEventListener('click', (e) => {
    const actionEl = e.target.closest('[data-action]');
    const navEl = e.target.closest('[data-nav]');
    const statusEl = e.target.closest('[data-status-filter]');

    if (navEl) { UI.goTo(navEl.dataset.nav); return; }
    if (statusEl) { State.contractsFilter.status = statusEl.dataset.statusFilter; UI.render(); return; }

    if (!actionEl) return;
    const action = actionEl.dataset.action;
    const id = actionEl.dataset.id;

    switch (action) {
      case 'close-modal': UI.closeModal(); break;
      case 'calc-currency': State.calc.currency = actionEl.dataset.currency; UI.render(); break;
      case 'calc-toggle-schedule': {
        const m = Number(actionEl.dataset.months);
        State.calc.expanded[m] = !State.calc.expanded[m];
        UI.render();
        break;
      }
      case 'new-contract': Modals.contractForm(null); break;
      case 'edit-contract': Modals.contractForm(Contracts.getById(id)); break;
      case 'open-contract': State.currentContractId = id; UI.goTo('contractDetail'); break;
      case 'back-contracts': UI.goTo('contracts'); break;
      case 'accept-payment': Modals.paymentForm(id); break;
      case 'open-skip-payment': UI.closeModal(); Modals.skipPaymentConfirm(id); break;
      case 'quick-pay': {
        const c = Contracts.getById(id);
        const s = Contracts.getStats(c);
        const amount = Math.min(s.monthlyPayment || s.remaining, s.remaining);
        if (amount <= 0) { UI.toast('Договор уже закрыт', 'error'); break; }
        Contracts.addPayment(id, { amount, date: Utils.todayStr(), comment: 'Ежемесячный платёж' });
        UI.toast('Оплата принята: ' + Utils.formatMoney(amount), 'success');
        UI.render();
        break;
      }
      case 'delete-payment': {
        const cid = actionEl.dataset.cid, pid = actionEl.dataset.pid;
        UI.confirmModal('Удалить платёж?', 'Это действие нельзя отменить. Остаток будет пересчитан.', () => {
          Contracts.removePayment(cid, pid); UI.toast('Платёж удалён', 'success'); UI.render();
        }, true);
        break;
      }
      case 'delete-contract':
        UI.confirmModal('Удалить договор?', 'Договор и вся история платежей будут удалены безвозвратно.', () => {
          Contracts.remove(id); UI.toast('Договор удалён', 'success'); UI.goTo('contracts');
        }, true);
        break;
      case 'print-contract': printContract(id); break;
      case 'save-comment': {
        const c = Contracts.getById(id);
        c.comment = val('commentField');
        Storage.save();
        UI.toast('Комментарий сохранён', 'success');
        break;
      }
      case 'change-pin': Modals.pinForm(); break;
      case 'save-usd-rate': Settings.update({ usdRate: Number(val('usdRateInput')) || 0 }); UI.toast('Курс сохранён', 'success'); break;
      case 'export-json': exportJSON(); break;
      case 'export-excel': exportExcel(); break;
      case 'clear-data':
        UI.confirmModal('Очистить все данные?', 'Все договоры и настройки будут удалены безвозвратно. Рекомендуем сначала сделать экспорт.', () => {
          Storage._state = Storage.defaultState();
          Storage.save();
          UI.toast('Данные очищены', 'success');
          UI.goTo('dashboard');
        }, true);
        break;
      case 'month-prev': {
        const mv = State.monthView; mv.month--; if (mv.month < 0) { mv.month = 11; mv.year--; } UI.render(); break;
      }
      case 'month-next': {
        const mv = State.monthView; mv.month++; if (mv.month > 11) { mv.month = 0; mv.year++; } UI.render(); break;
      }
    }
  });

  document.addEventListener('input', (e) => {
    if (e.target.id === 'calcPriceInput') {
      const raw = Calculator.clean(e.target.value);
      const currency = State.calc.currency;
      if (currency === 'uzs') State.calc.priceUzs = raw; else State.calc.priceUsd = raw;
      e.target.value = raw ? raw.toLocaleString('ru-RU') : '';
      const pos = e.target.value.length;
      e.target.setSelectionRange(pos, pos);
      document.getElementById('calcBadge').innerHTML = Utils.escapeHtml(Calculator.badgeHtml(raw, currency));
      document.getElementById('calcResults').innerHTML = Calculator.renderResults(raw, currency);
      return;
    }
    if (e.target.id === 'heroSearch' || e.target.id === 'contractsSearch') {
      State.contractsFilter.query = e.target.value;
      if (UI.currentPage !== 'contracts') { UI.currentPage = 'contracts'; }
      UI.render();
      const el = document.getElementById('contractsSearch');
      if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    }
  });

  document.addEventListener('change', (e) => {
    if (e.target.id === 'contractsSort') { State.contractsFilter.sort = e.target.value; UI.render(); }
    if (e.target.id === 'importFile' && e.target.files[0]) { importJSON(e.target.files[0]); }
  });

  document.getElementById('themeToggle').addEventListener('click', toggleTheme);
  document.addEventListener('click', (e) => {
    if (e.target.id === 'settingsThemeSwitch') toggleTheme();
  });
}

/* ============================================================
   APP — точка входа
   ============================================================ */
const App = {
  init() {
    Storage.load();
    applyTheme(Settings.get().theme || 'light');
    bindGlobalEvents();
    UI.render();
    Lock.check();
  },
};

document.addEventListener('DOMContentLoaded', App.init);

})();
</script>
